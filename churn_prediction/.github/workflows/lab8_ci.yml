name: Lab 8 CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pandas numpy scikit-learn PyYAML joblib mlflow matplotlib xgboost-cpu
      - run: python -m compileall -q src pipelines tests
      - run: python -m unittest discover -s tests -v
      - run: python src/mlops_pipeline/churn_prediction_pipeline.py --through-lab8
