name: Customer Churn Lab 8 CI
on:
  push:
    paths:
      - "churn_prediction/**"
      - ".github/workflows/churn_lab8_ci.yml"
  pull_request:
    paths:
      - "churn_prediction/**"
      - ".github/workflows/churn_lab8_ci.yml"
  workflow_dispatch:
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: churn_prediction/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pandas numpy scikit-learn PyYAML joblib mlflow matplotlib xgboost-cpu
      - run: python -m compileall -q src pipelines tests
        working-directory: churn_prediction
      - run: python -m unittest discover -s tests -v
        working-directory: churn_prediction
      - run: python src/mlops_pipeline/churn_prediction_pipeline.py --through-lab8
        working-directory: churn_prediction
