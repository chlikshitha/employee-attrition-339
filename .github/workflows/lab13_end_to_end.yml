name: Lab 13 - Employee Attrition End to End
on:
  push:
    paths: ["**"]
  pull_request:
    paths: ["**"]
  workflow_dispatch:
jobs:
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m src.lab13_end_to_end
      - uses: actions/upload-artifact@v7
        with:
          name: employee-attrition-reports
          path: reports/*.json


