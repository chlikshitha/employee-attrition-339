name: Lab 9 - Failure Handling
on:
  push:
    paths: ["**"]
  pull_request:
    paths: ["**"]
  workflow_dispatch:
jobs:
  failure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m src.lab9_failure_tests


