apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-attrition-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-attrition-api
  template:
    metadata:
      labels:
        app: employee-attrition-api
    spec:
      containers:
        - name: api
          image: employee-attrition-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: employee-attrition-api
spec:
  selector:
    app: employee-attrition-api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
