name: Lab 4 - MLflow Experiment Tracking
on:
  push:
    paths: ["**"]
  pull_request:
    paths: ["**"]
  workflow_dispatch:
jobs:
  tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python pipelines/run_lab4_tracking.py


