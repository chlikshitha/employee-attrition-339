name: Lab 10 - Inference
on:
  push:
    paths: ["**"]
  pull_request:
    paths: ["**"]
  workflow_dispatch:
jobs:
  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m src.lab7_pipeline
      - run: python -m src.lab10_inference


