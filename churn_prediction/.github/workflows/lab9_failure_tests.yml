name: Lab 9 Failure Handling
on:
  workflow_dispatch:
  push:
    paths:
      - "src/mlops_pipeline/**"
      - "tests/**"
      - "config.yaml"
      - ".github/workflows/lab9_failure_tests.yml"
jobs:
  failure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pandas numpy scikit-learn PyYAML joblib mlflow matplotlib xgboost-cpu
      - run: python -m unittest discover -s tests -v
      - run: python src/mlops_pipeline/churn_prediction_pipeline.py
