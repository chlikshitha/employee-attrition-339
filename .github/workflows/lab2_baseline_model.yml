name: Lab 2 - Employee Attrition Baseline Model
on:
  push:
    paths: ["**"]
  pull_request:
    paths: ["**"]
  workflow_dispatch:
jobs:
  baseline-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "requirements.txt"
      - run: python -m pip install -r requirements.txt
      - run: python -m src.lab1_data_preparation
      - run: python -m src.lab2_baseline_model
      - uses: actions/upload-artifact@v7
        with:
          name: employee-attrition-lab2
          path: |
            models/lab2_baseline_model.joblib
            reports/lab2_baseline_metrics.json
            outputs/lab2_baseline_predictions.csv